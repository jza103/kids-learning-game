<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spelling Quest</title>
  <meta name="theme-color" content="#6d4aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spelling">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      // When an update takes over, load it (the app waits until a round ends).
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloading) return;
        reloading = true;
        window.__klgUpdate ? window.__klgUpdate() : location.reload();
      });
      window.addEventListener('load', async () => {
        const reg = await navigator.serviceWorker.register('sw.js');
        // A home-screen app can stay open for days; check for updates when it comes back.
        document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && reg.update());
      });
    }
  </script>
</body>
</html>
